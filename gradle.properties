# Toolchain JDK: build with a JDK 17, 21 or 25 install (the Gradle 9.4.1 / AGP 9.2.1 pair does not run on
# JDK 26). org.gradle.java.home is deliberately NOT set here: it is a machine-specific absolute path.
# Set it per developer in %USERPROFILE%\.gradle\gradle.properties.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.daemon=true
# Off until a module has a reason to turn it on: the version stamp reads the clock at configuration time
# (build-logic), and a cached configuration would replay a stale instant.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official
kotlin.incremental=true

# KSP still wires generated sources through kotlin.sourceSets under AGP's built-in Kotlin. Keep this
# override until the KSP plugin switches to AndroidSourceSet.kotlin.
android.disallowKotlinSourceSets=false

# KSP2 crashes with "this and base files have different roots" when the Gradle cache and the project sit
# on different Windows drives (here C:\Users\..\.gradle against P:\..). It dies before any Kotlin of the
# module compiles. Inert on a single-root layout; drop it once KSP fixes the path computation upstream.
# Same defect and same remedy as FastMediaSorter (its S1375) and StreamsPlayer.
ksp.incremental=false

# 16 KB page size support (mandatory for Google Play since 2025-11-01).
android.bundle.enableNativeLibraryAlignment=true
