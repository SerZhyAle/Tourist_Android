# Version catalog. Toolchain pins follow FastMediaSorter's current values (docs/TECH_STACK.md read
# 2026-10-23, S0002); the two products do not share a build, so a pin moves here on its own ticket,
# never by reference.
[versions]
agp = "9.2.1"
kotlin = "2.2.10"
ksp = "2.3.8"
hilt = "2.59"

# Platform levels. minSdk of the phone and the watch app are the handoff reference values (tactical
# decision); targetSdk is what Play requires at the first release and is re-checked by S0010. The
# watch face floor is Watch Face Format version 4 (Wear OS 6, API 36), after the FastMediaSorter and
# StreamsPlayer watch-face precedents; this product's composition is decided before S0009.
compile-sdk = "37"
target-sdk = "36"
min-sdk-phone = "26"
min-sdk-wear = "28"
min-sdk-watchface = "36"

androidx-core-ktx = "1.13.0"
androidx-appcompat = "1.7.1"
google-material = "1.14.0"
androidx-activity-compose = "1.10.1"
androidx-lifecycle = "2.8.7"
compose-bom = "2024.12.01"
androidx-wear-compose = "1.4.1"
kotlinx-coroutines = "1.7.3"
junit = "4.13.2"
timber = "5.0.1"
mockk = "1.13.9"
robolectric = "4.16.1"

# Pins the dashboard port reads at FastMediaSorter's values (S0004).
androidx-recyclerview = "1.3.2"
androidx-constraintlayout = "2.1.4"
androidx-activity-ktx = "1.10.1"
okhttp = "4.12.0"

# Pins the lights port reads at FastMediaSorter's values (S0005).
androidx-fragment-ktx = "1.6.2"

# Pins the SOS Wear Data Layer port reads at FastMediaSorter's values (S0006).
google-gms-play-services-wearable = "18.1.0"

# Pins the watch app port reads at FastMediaSorter's values (S0008).
accompanist-permissions = "0.34.0"
androidx-datastore-preferences = "1.1.7"
androidx-hilt-navigation-compose = "1.1.0"
androidx-wear-compose-navigation = "1.4.1"
androidx-wear-input = "1.1.0"
androidx-wear-ongoing = "1.0.0"
androidx-wear-wear = "1.3.0"
gson = "2.10.1"

[libraries]
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "google-material" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }

androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity-ktx" }
okhttp-okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidx-fragment-ktx" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "androidx-wear-compose" }
androidx-wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "androidx-wear-compose" }
androidx-wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "androidx-wear-compose-navigation" }
androidx-wear-input = { group = "androidx.wear", name = "wear-input", version.ref = "androidx-wear-input" }
androidx-wear-ongoing = { group = "androidx.wear", name = "wear-ongoing", version.ref = "androidx-wear-ongoing" }
androidx-wear-wear = { group = "androidx.wear", name = "wear", version.ref = "androidx-wear-wear" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidx-hilt-navigation-compose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidx-datastore-preferences" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
